<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Humanizer</title>
<style>
:root{--bg:#f6f7f4;--surface:#fff;--ink:#1c2420;--muted:#5f6b64;--line:#d5dad4;--accent:#1f6f54;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--surface:#1c2420;--ink:#e8ece9;--muted:#9aa7a0;--line:#2f3a34;--accent:#4fbf94;--accent-ink:#0f1f18}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Inter",system-ui,sans-serif;padding:20px 16px 48px}
main{max-width:820px;margin:0 auto}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.01em}
p.sub{margin:0 0 18px;color:var(--muted)}
textarea{width:100%;min-height:170px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;resize:vertical}
textarea:focus,select:focus,input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0 20px}
select,input[type=number]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
input[type=number]{width:110px}
button{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
label.chk{display:flex;gap:6px;align-items:center;color:var(--muted)}
.card{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:14px}
.card header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:.9rem}
.card textarea{border:0;border-radius:0 0 8px 8px;min-height:140px}
.hint{color:var(--muted);font-size:.88rem}
</style>
</head>
<body>
<main>
  <h1>Humanizer</h1>
  <p class="sub">Paste AI text, pick a tone, copy the result. Runs in your browser; nothing is sent anywhere.</p>
  <textarea id="in" placeholder="Paste text here"></textarea>
  <div class="bar">
    <select id="tone" aria-label="Tone"></select>
    <button class="primary" id="go">Humanize</button>
    <button id="regen">Regenerate</button>
    <label class="chk"><input type="checkbox" id="multi"> Show 3 versions</label>
    <input type="number" id="seed" placeholder="Seed" aria-label="Seed">
  </div>
  <p class="hint">Humanize reuses the seed shown, so the same text, tone and seed give the same result. Regenerate picks a new seed.</p>
